<!DOCTYPE html>
<html>
<head>
    <title>Digital Visitor Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Visitor Registration</h1>

    <form action="/register" method="POST">

        <label>Visitor Name</label>
        <input type="text" name="name" required>

        <label>Phone Number</label>
        <input type="text" name="phone" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Person to Visit</label>
        <input type="text" name="person" required>

        <label>Purpose of Visit</label>
        <textarea name="purpose" required></textarea>

        <button type="submit">Register Visitor</button>

    </form>

</div>

</body>
</html>
