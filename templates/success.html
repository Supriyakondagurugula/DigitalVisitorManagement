<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
            background-color: #f2f2f2;
        }

        .box {
            width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Visitor Registered Successfully</h1>

    <p><b>Name:</b> {{ name }}</p>
    <p><b>Phone:</b> {{ phone }}</p>
    <p><b>Email:</b> {{ email }}</p>
    <p><b>Person to Visit:</b> {{ person }}</p>
    <p><b>Purpose:</b> {{ purpose }}</p>

    <p>Thank you for registering.</p>

</div>

</body>
</html>
